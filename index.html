<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I Love You Heart - Edlawit</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    canvas { display:block; }
    .hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">Touch / move to rotate ❤</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();const pts = []; for (let t = 0; t < Math.PI * 2; t += 0.03) { const x = 16 * Math.pow(Math.sin(t), 3); const y = -(13Math.cos(t)-5Math.cos(2t)-2Math.cos(3t)-Math.cos(4t)); for (let z=-8; z<=8; z+=1.2) pts.push({x,y,z}); }

let mx = 0, my = 0; addEventListener('mousemove', e => { mx = (e.clientX / innerWidth - 0.5) * 1.5; my = (e.clientY / innerHeight - 0.5) * 1.5; }); addEventListener('touchmove', e => { const t = e.touches[0]; mx = (t.clientX / innerWidth - 0.5) * 1.5; my = (t.clientY / innerHeight - 0.5) * 1.5; }, {passive:true});

function rotate(p, ax, ay){ let {x,y,z} = p; let cy=Math.cos(ay), sy=Math.sin(ay); [x,z]=[xcy-zsy, xsy+zcy]; let cx=Math.cos(ax), sx=Math.sin(ax); [y,z]=[ycx-zsx, ysx+zcx]; return {x,y,z}; }

function draw(time){ ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fillRect(0,0,canvas.width,canvas.height);

const ax = time0.0007 + my; const ay = time0.001 + mx;

for (const p of pts) { const r = rotate(p, ax, ay); const scale = 18 + (r.z + 8) * 1.1; const X = canvas.width/2 + r.x * scale; const Y = canvas.height/2 + r.y * scale; const a = Math.max(0.2, (r.z+8)/16); ctx.fillStyle = rgba(255,0,80,${a}); ctx.font = ${Math.max(8, scale*0.22)}px Arial; ctx.fillText('I LOVE YOU', X, Y); }

ctx.textAlign='center'; ctx.fillStyle='white'; ctx.font='bold 42px Arial'; ctx.fillText('Edlawit', canvas.width/2, canvas.height/2 + 8); ctx.font='24px Arial'; ctx.fillText('❤', canvas.width/2, canvas.height/2 + 45);

requestAnimationFrame(draw); } requestAnimationFrame(draw); </script>

</body>
</html>
